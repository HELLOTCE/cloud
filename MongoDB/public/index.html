<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MongoDB Records</title>
  </head>
  <body>
    <main>
      <h1>MongoDB records</h1>
      <p>Create, load, edit, and delete records in MongoDB.</p>

      <h2 id="form-heading">Create record</h2>
      <p><label>Title <input id="title" type="text" /></label></p>
      <p><label>Description <textarea id="description"></textarea></label></p>
      <button id="save-button" type="button">Create</button>
      <button id="cancel-button" type="button" hidden>Cancel</button>
      <button id="load-button" type="button">Load records</button>

      <p id="status" role="status"></p>
      <h2>Stored records</h2>
      <ul id="records"></ul>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
